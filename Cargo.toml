[package]
name = "shella"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Sistem neuromorfik Rust dengan jaringan LIF, pembelajaran, dan SDK modular"

[lib]
name = "shella"
path = "src/lib.rs"

[[bin]]
name = "shella"
path = "src/main.rs"

[[bin]]
name = "dataset-integrity"
path = "src/bin/dataset_integrity.rs"

[[bin]]
name = "shella-lm"
path = "src/bin/shella_lm.rs"

[dependencies]
aes-gcm = "0.10"
candle-core = "=0.8.4"
candle-nn = "=0.8.4"
csv = "1.3"
ed25519-dalek = "2"
flate2 = "1"
fs2 = "0.4"
getrandom = "0.3"
hashbrown = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
sha1 = "0.10"
sha2 = "0.10"
tar = "0.4"
unicode-normalization = "0.1"

[[bench]]
name = "learning"
harness = false

[[bench]]
name = "system"
harness = false

[[bench]]
name = "language"
harness = false

[lints.rust]
unsafe_code = "forbid"
